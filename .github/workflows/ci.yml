name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Offline demo runs end to end
        run: python -m triage demo E01 --yes
      - name: Baseline evaluation runs on the frozen data
        run: python -m evals.run --backend rules --set eval --label ci-baseline
